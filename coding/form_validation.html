<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeritageTrail - Visit Planning Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>HeritageTrail</h1>
<h2>Heritage Visit Planning Form</h2>
<p>Discover local heritage. Travel responsibly.</p>
</header>
<hr>
<main>
<form action="#" method="post">
<fieldset>
<legend><strong>Visitor Details</strong></legend>
<p>
<label for="fullname">Full Name:</label><br>
<input type="text" id="fullname" name="fullname"
minlength="3" maxlength="50" placeholder="Enter
your full name" required>
</p>
<p>
<label for="email">Email Address:</label><br>
<input type="email" id="email" name="email"
placeholder="name@example.com" required>
</p>
<p>
<label for="phone">Mobile Number (10 digits):</label><br>
<input type="tel" id="phone" name="phone"
pattern="[0-9]{10}" inputmode="numeric"
title="Enter exactly 10 digits" required>
</p>
<p>
<label for="website">Travel Blog URL (optional):</label><br>
<input type="url" id="website" name="website"
placeholder="https://example.com">
</p>
</fieldset>
<br>
<fieldset>
<legend><strong>Visit Details</strong></legend>
<p>
<label for="location">Select Location:</label><br>
<select id="location" name="location" required>
<option value="">-- Choose a location --</option>
<option>Mysuru</option>
<option>Tamil Nadu</option>
<option>Rajasthan</option>
<option>Madhya Pradesh</option>
</select>
</p>
<p>
<label for="heritage">Heritage Category:</label><br>
<select id="heritage" name="heritage" required>
<option value="">-- Choose a category --</option>
<option>Forts</option>
<option>Museums</option>
<option>Temples</option>
<option>Monuments</option>
<option>Cultural Villages</option>
<option>Historical Buildings</option>
</select>
</p>
<p>
<label for="visitdate">Visit Date (2026 only):</label><br>
<input type="date" id="visitdate" name="visitdate"
min="2026-01-01" max="2026-12-31" required>
</p>
<p>
<label for="visitors">Number of Visitors (1 to 10):</label><br>
<input type="number" id="visitors" name="visitors"
min="1" max="10" step="1" required>
</p>
<p>
Visitor Category:<br>
<input type="radio" id="student" name="category"
value="Student" required>
<label for="student">Student</label>
<input type="radio" id="family" name="category"
value="Family">
<label for="family">Family</label>
<input type="radio" id="other" name="category"
value="Other">
<label for="other">Other</label>
</p>
<p>
<label for="request">Special Request (optional):</label><br>
<textarea id="request" name="request" rows="2" cols="35" maxlength="200"
placeholder="Maximum 200 characters"></textarea>
</p>
</fieldset>
<p>Avoid littering, respect local culture and protect monuments.</p>
<p>
<input type="checkbox" id="terms" name="terms" required>
<label for="terms">I agree to follow these guidelines.</label>
</p>
<p>
<button type="submit">Submit Visit Plan</button>
<button type="reset">Reset Form</button>
</p>
</form>
</main>
<hr>
<footer>
<p>&copy; 2026 HeritageTrail | Team 10</p>
</footer>
</body>
<script src="auth.js"></script>
</html>
